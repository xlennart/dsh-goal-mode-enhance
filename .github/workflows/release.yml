name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Same gate as verify.yml: published devDependencies give real host typings,
      # every `@deepseek-ai/dsh-*` import stays external for the host profile.
      - name: Install, typecheck, build
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
          node scripts/smoke-client.mjs
      - name: Pack the prebuilt tarball
        run: |
          test -f lib/index.js
          test -f lib/client.js
          npm pack
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "dsh-goal-mode $GITHUB_REF_NAME" \
            --notes "Prebuilt installable tarball (lib/ included, no build needed on your machine). Verified against DSH 0.2.2-rc.1. Install: dsh plugin --profile web add <path-to-tgz>, then restart the harness. See COMPATIBILITY.md for the compatible DSH range." \
            dsh-goal-mode-*.tgz
