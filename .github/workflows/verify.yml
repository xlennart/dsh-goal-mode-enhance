name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # devDependencies point at published @deepseek-ai/* 0.2.2-rc.1 packages, so a
      # plain install gives us the real host typings. Every `@deepseek-ai/dsh-*`
      # import in the bundle stays external (declared optional-peer, provided by
      # the host profile).
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck against the target host typings
        run: npm run typecheck
      - name: Build the installable bundle
        run: npm run build
      - name: Check bundle output
        run: |
          test -f lib/index.js
          test -f lib/client.js
      - name: Offline smoke of the client bundle
        run: node scripts/smoke-client.mjs
      - name: Check the host half loads
        run: node -e "import('./lib/index.js').then(m=>{if(typeof m.apply!=='function')process.exit(1)})"
